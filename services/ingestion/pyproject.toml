[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcc-ingestion"
version = "0.1.0"
description = "FastAPI ingestion worker bootstrap for the MCC MVP monorepo."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "google-genai==1.31.0",
  "groq==0.31.0",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "ruff==0.12.8",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
