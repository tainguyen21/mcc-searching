services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mcc
      POSTGRES_USER: mcc
      POSTGRES_PASSWORD: mcc_local_only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcc -d mcc"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:24-bookworm
    profiles: ["app"]
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter api start:prod"
    volumes: [".:/workspace"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_WEB_ORIGIN: ${NEXT_PUBLIC_WEB_ORIGIN}
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-bookworm
    profiles: ["app"]
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter web start"
    volumes: [".:/workspace"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_started

  ingestion:
    image: python:3.12-slim
    profiles: ["app"]
    working_dir: /workspace/services/ingestion
    command: sh -c "pip install -e . && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: [".:/workspace"]
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_BASE_URL: http://api:3001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    ports: ["8000:8000"]
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
